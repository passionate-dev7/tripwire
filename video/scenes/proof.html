<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:"PS";src:url(fonts/sans.woff2);font-weight:400 600}
@font-face{font-family:"PM";src:url(fonts/mono-400.woff2);font-weight:400}
@font-face{font-family:"PM";src:url(fonts/mono-500.woff2);font-weight:500}
:root{--canvas:#07080a;--surface:#0d0d0d;--card:#121212;--hair:#242728;--hair2:rgba(255,255,255,.16);--ink:#f4f4f6;--body:#cdcdcd;--mute:#9c9c9d;--ash:#6a6b6c;--red:#ff6161;--redsoft:rgba(255,97,97,.15)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;background:var(--canvas);color:var(--ink);overflow:hidden;font-family:"PS",sans-serif}
.mono{font-family:"PM",monospace;font-variant-numeric:tabular-nums}
.k{font:500 15px "PM";letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
</style>
<style>
.wrap{position:absolute;left:200px;right:200px;top:150px}
.ttl{font:500 22px "PM";letter-spacing:.1em;color:var(--body);margin-bottom:46px;opacity:0}
.blk{border-top:1px solid var(--hair);padding:34px 0 38px;opacity:0}
.net{font:500 30px "PS";letter-spacing:-.01em;margin-bottom:22px}
.net i{font-style:normal;color:var(--mute);font:400 18px "PM";margin-left:16px}
.cnt{display:flex;gap:90px}
.c .n{font:500 118px/1 "PM";letter-spacing:-.03em}
.c .l{font:500 24px "PM";letter-spacing:.1em;color:var(--body);margin-top:14px}
.c.ok .n{color:var(--ink)}
.foot{margin-top:18px;font:400 16px "PM";color:var(--mute);opacity:0;line-height:1.6}
</style>
<div class="wrap"><div class="ttl" id="ttl"></div><div id="blks"></div><div class="foot" id="foot"></div></div>
<script src="engine.js"></script>
<script>
// cues: title, blocks [{net, note, sent, refused, paid, at}], foot, footAt
const B = cue("blocks", []);
$("#ttl").textContent = cue("title", ""); $("#foot").innerHTML = cue("foot", "");
B.forEach((b, i) => { const d = document.createElement("div"); d.className = "blk"; d.id = "b" + i;
  d.innerHTML = `<div class="net">${b.net}<i>${b.note}</i></div><div class="cnt"><div class="c"><div class="n" id="n${i}0">0</div><div class="l">TRIED</div></div><div class="c"><div class="n" id="n${i}1">0</div><div class="l">REFUSED</div></div><div class="c ok"><div class="n">${b.paid}</div><div class="l">GOT THROUGH</div></div></div>`;
  $("#blks").append(d); });
window.render = (t) => {
  $("#ttl").style.opacity = eo(seg(t, -0.4, 0));
  B.forEach((b, i) => { const a = b.at, k = eo(seg(t, a, a + 0.5)), c = eo(seg(t, a + 0.3, a + 1.4));
    const r = $("#b" + i); r.style.opacity = k; r.style.transform = `translateY(${12 * (1 - k)}px)`;
    $("#n" + i + "0").textContent = Math.round(b.sent * c); $("#n" + i + "1").textContent = Math.round(b.refused * c); });
  $("#foot").style.opacity = eo(seg(t, cue("footAt", 3), cue("footAt", 3) + 0.5));
};
</script>
