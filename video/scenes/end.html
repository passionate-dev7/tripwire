<!doctype html>
<meta charset="utf-8">
<style>
@font-face{font-family:"PS";src:url(fonts/sans.woff2);font-weight:400 600}
@font-face{font-family:"PM";src:url(fonts/mono-400.woff2);font-weight:400}
@font-face{font-family:"PM";src:url(fonts/mono-500.woff2);font-weight:500}
:root{--canvas:#07080a;--surface:#0d0d0d;--card:#121212;--hair:#242728;--hair2:rgba(255,255,255,.16);--ink:#f4f4f6;--body:#cdcdcd;--mute:#9c9c9d;--ash:#6a6b6c;--red:#ff6161;--redsoft:rgba(255,97,97,.15)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:900px;background:var(--canvas);color:var(--ink);overflow:hidden;font-family:"PS",sans-serif}
.mono{font-family:"PM",monospace;font-variant-numeric:tabular-nums}
.k{font:500 15px "PM";letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
</style>
<style>
#mark{position:absolute;left:635px;top:60px;width:330px;height:330px}
.wm{position:absolute;left:0;right:0;top:410px;text-align:center;font:600 84px "PS";letter-spacing:-.03em;opacity:0}
.tag{position:absolute;left:0;right:0;top:520px;text-align:center;font:400 28px "PS";color:var(--body);opacity:0}
.url{position:absolute;left:0;right:0;top:584px;text-align:center;font:600 76px "PS";letter-spacing:-.025em;color:var(--ink);opacity:0}
.note{position:absolute;left:0;right:0;top:686px;text-align:center;font:400 22px "PS";color:var(--mute);opacity:0}
</style>
<svg id="mark" viewBox="0 0 1024 1024"><g transform="translate(0 -10)"><line id="ln" x1="110" y1="430" x2="914" y2="430" stroke="#ff6161" stroke-width="52" stroke-linecap="round" stroke-dasharray="804" stroke-dashoffset="804"/><path id="pc" d="M140 260 L300 180 L400 260 L730 710" fill="none" stroke="#f4f4f6" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1200" stroke-dashoffset="1200"/><circle id="dt" cx="524" cy="430" r="0" fill="#ff6161" stroke="#07080a" stroke-width="30"/></g></svg>
<div class="wm" id="wm">tripwire</div><div class="tag" id="tag"></div><div class="url" id="url"></div><div class="note" id="note"></div>
<script src="engine.js"></script>
<script>
$("#tag").textContent = cue("tag", ""); $("#url").textContent = cue("url", ""); $("#note").textContent = cue("note", "");
window.render = (t) => {
  $("#ln").style.strokeDashoffset = 804 * (1 - eio(seg(t, 0.2, 1.0)));
  $("#pc").style.strokeDashoffset = 1200 * (1 - eio(seg(t, 0.8, 2.0)));
  const d = eo(seg(t, 1.5, 1.9)); $("#dt").setAttribute("r", 78 * d);
  $("#wm").style.opacity = eo(seg(t, cue("word", 2.0), cue("word", 2.0) + 0.5));
  $("#tag").style.opacity = eo(seg(t, cue("tagAt", 2.8), cue("tagAt", 2.8) + 0.5));
  $("#url").style.opacity = eo(seg(t, cue("urlAt", 3.6), cue("urlAt", 3.6) + 0.5));
  $("#note").style.opacity = eo(seg(t, cue("urlAt", 3.6) + 0.3, cue("urlAt", 3.6) + 0.8));
};
</script>
